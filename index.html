<!DOCTYPE html>

</head>
<body class="bg-gray-100 font-sans">
<div class="max-w-md mx-auto bg-white min-h-screen shadow-lg flex flex-col relative overflow-hidden">

    </header>

    <div class="p-4 bg-white shadow-sm z-10 relative border-b border-gray-100">
        <label for="departure-input" class="block text-xs font-bold text-gray-600 mb-1">출발지 입력</label>
        <div class="flex gap-2">
            <button id="btn-gps" class="bg-gray-100 p-3 rounded-lg border border-gray-300 hover:bg-gray-200 transition flex-shrink-0" title="현재 위치 가져오기" aria-label="현재 위치 가져오기">📍</button>
            <input type="text" id="departure-input" class="min-w-0 flex-1 border border-gray-300 p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="건물명 또는 주소 (예: 생명과학관)">
            <button id="btn-search" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-4 py-3 rounded-lg transition shadow flex-shrink-0">찾기</button>
        </div>
        <p class="text-xs text-gray-400 mt-2">건물명 검색은 건국대학교 서울캠퍼스 기준으로 시도합니다.</p>

    <div id="map" class="flex-grow w-full relative z-0" style="min-height:50vh;"></div>

                <button id="admin-close-btn" class="text-gray-500 hover:text-gray-800 text-xl font-bold" aria-label="닫기">&times;</button>

            <div class="p-4">

                    <h3 class="font-bold text-gray-800 mb-2 text-sm">관리자 로그인</h3>
                    <p class="text-xs text-gray-500 mb-3">Firebase Authentication에 등록한 관리자 이메일과 비밀번호를 입력하세요.</p>
                    <label class="block text-xs text-gray-600 mb-1" for="admin-email">이메일</label>

                    <input id="admin-password" type="password" autocomplete="current-password" class="w-full border rounded p-2 text-sm mb-3" placeholder="비밀번호">
                    <button id="admin-login-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white rounded p-2 text-sm font-bold">로그인</button>
                </div>

                <div id="admin-tools" class="hidden">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-sm font-bold text-green-700">관리자 인증 완료</span>

                    <h3 class="font-bold text-gray-800 mb-2 text-sm">📁 흡연 구역 TXT 업로드</h3>
                    <p class="text-xs text-gray-500 mb-3">파일 형식: <code class="bg-gray-100 px-1 rounded">장소이름: 위도, 경도</code><br>업로드하면 Firebase에 저장되어 모든 기기에 반영됩니다.</p>
                    <input type="file" id="data-file-upload" accept=".txt,text/plain" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>

                </div>

                <div class="mt-6">
                    <h3 class="font-bold text-gray-700 text-xs mb-2">등록된 흡연 구역 목록</h3>
                    <ul id="smoking-area-list" class="space-y-1 text-xs text-gray-600 max-h-40 overflow-y-auto bg-gray-50 p-2 rounded border border-gray-200">

                    </ul>

</div>

<script>
'use strict';

// 1) Firebase 설정
const firebaseConfig = {
    apiKey: "AIzaSyDks5LXHi5KHfHnM0W69qIVVZvzoYG-k9g",
    authDomain: "konkuk-smoking-map.firebaseapp.com",
    databaseURL: "https://konkuk-smoking-map-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "konkuk-smoking-map",
    storageBucket: "konkuk-smoking-map.firebasestorage.app",
    messagingSenderId: "705413941392",
    appId: "1:705413941392:web:141d8125c3ad983c8db015",
    measurementId: "G-2B651MPKX9"
};

// Firebase 콘솔에서 생성한 관리자 계정의 UID로 반드시 교체하세요.
const ADMIN_UID = "ycUyrcq5sEMKaax1rBkItDOHIlb2";
const DATABASE_PATH = "smokingAreas";

// 기본 목록은 Firebase 최초 연결 전/연결 실패 시 임시 표시용입니다.
// Firebase에 데이터가 저장되어 있으면 실시간 데이터가 이를 대체합니다.
const DEFAULT_SMOKING_AREAS = {
    "생명과학관 주차장": [37.54127, 127.07441]
};

let auth = null;
let database = null;
let smokingAreas = {};
let map = null;
let userMarker = null;
let markers = [];
let smokingAreaMarkers = {};
let currentUserLatLng = null;
let firebaseReady = false;
let firebaseListenerAttached = false;

const $ = id => document.getElementById(id);

function showResult(message, isError = false) {
    const panel = $("result-panel");
    panel.classList.remove("hidden");
    panel.innerHTML = "";
    const span = document.createElement("span");
    span.className = isError ? "text-red-600 font-bold" : "text-blue-700";
    span.textContent = message;
    panel.appendChild(span);
}

function setSyncStatus(message, isError = false) {
    const el = $("sync-status");
    el.textContent = message;
    el.className = "px-4 py-2 text-xs border-b " +
        (isError ? "bg-red-50 text-red-700" : "bg-gray-50 text-gray-500");
}

function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, ch => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[ch]));
}

function initializeFirebase() {
    if (!window.firebase) {
        setSyncStatus("Firebase SDK를 불러오지 못했습니다. 네트워크 연결을 확인해주세요.", true);
        return;
    }
    try {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        database = firebase.database();

        auth.onAuthStateChanged(user => updateAdminUI(user));

        // value 리스너는 서버 데이터가 변경될 때마다 모든 접속 기기에 갱신 내용을 전달합니다.
        database.ref(DATABASE_PATH).on("value", snapshot => {
            const data = snapshot.val();
            if (data && typeof data === "object" && !Array.isArray(data)) {
                const normalized = {};
                Object.entries(data).forEach(([name, coords]) => {
                    if (Array.isArray(coords) && coords.length >= 2) {
                        const lat = Number(coords[0]);
                        const lng = Number(coords[1]);
                        if (Number.isFinite(lat) && Number.isFinite(lng) &&
                            lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
                            normalized[name] = [lat, lng];
                        }
                    }
                });
                smokingAreas = normalized;
            } else {
                smokingAreas = {};
            }
            firebaseReady = true;
            if (map) renderSmokingAreas(smokingAreas);
            setSyncStatus("Firebase 실시간 동기화 연결됨 · 최신 목록을 표시하고 있습니다.");
        }, error => {
            console.error("Firebase 데이터 읽기 오류:", error);
            setSyncStatus("Firebase 데이터를 읽지 못했습니다. Database 읽기 규칙과 URL을 확인해주세요.", true);
            if (!firebaseReady) {
                smokingAreas = { ...DEFAULT_SMOKING_AREAS };
                if (map) renderSmokingAreas(smokingAreas);
            }
        });
        firebaseListenerAttached = true;
    } catch (error) {
        console.error("Firebase 초기화 오류:", error);
        setSyncStatus("Firebase 초기화 실패: 설정값과 SDK 로드를 확인해주세요.", true);
    }
}

function updateAdminUI(user) {
    const isAdmin = !!user && ADMIN_UID !== "여기에_관리자_UID_입력" && user.uid === ADMIN_UID;
    $("auth-panel").classList.toggle("hidden", isAdmin);
    $("admin-tools").classList.toggle("hidden", !isAdmin);

    if (user && !isAdmin) {
        $("upload-status").textContent = "로그인 계정이 관리자 UID와 일치하지 않습니다. 관리자 계정을 확인해주세요.";
    } else if (isAdmin) {
        $("upload-status").textContent = "TXT 파일을 선택하면 서버에 저장됩니다.";
    }
}

$("admin-open-btn").addEventListener("click", () => $("admin-modal").classList.remove("hidden"));
$("admin-close-btn").addEventListener("click", () => $("admin-modal").classList.add("hidden"));

$("admin-login-btn").addEventListener("click", async () => {
    const email = $("admin-email").value.trim();
    const password = $("admin-password").value;
    if (!email || !password) {
        $("upload-status").textContent = "이메일과 비밀번호를 입력해주세요.";
        return;
    }
    try {
        await auth.signInWithEmailAndPassword(email, password);
        if (auth.currentUser && auth.currentUser.uid !== ADMIN_UID) {
            await auth.signOut();
            $("upload-status").textContent = "관리자 권한이 없는 계정입니다.";
            alert("관리자 UID와 일치하지 않는 계정입니다.");
        }
    } catch (error) {
        console.error("로그인 오류:", error);
        alert("로그인에 실패했습니다. 이메일과 비밀번호, Authentication 설정을 확인해주세요.");
    }
});

$("admin-logout-btn").addEventListener("click", async () => {
    try { await auth.signOut(); }
    catch (error) { console.error("로그아웃 오류:", error); }
});

function parseSmokingAreaText(textData) {
    const parsed = {};
    const lines = textData.split(/\r?\n/);
    lines.forEach((line, index) => {
        if (!line.trim()) return;
        const colonIndex = line.indexOf(":");
        if (colonIndex < 0) {
            console.warn(`${index + 1}행 형식 오류: 콜론이 없습니다.`);
            return;
        }
        const name = line.slice(0, colonIndex).trim();
        const coords = line.slice(colonIndex + 1).split(",");
        if (!name || coords.length < 2) return;
        const lat = Number.parseFloat(coords[0].trim());
        const lng = Number.parseFloat(coords[1].trim());
        if (Number.isFinite(lat) && Number.isFinite(lng) &&
            lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180) {
            parsed[name] = [lat, lng];
        }
    });
    return parsed;
}

$("data-file-upload").addEventListener("change", async event => {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    if (!auth || !auth.currentUser || auth.currentUser.uid !== ADMIN_UID ||
        ADMIN_UID === "여기에_관리자_UID_입력") {
        alert("관리자 로그인이 필요합니다.");
        event.target.value = "";
        return;
    }
    try {
        const contents = await file.text();
        const parsedAreas = parseSmokingAreaText(contents);
        if (!Object.keys(parsedAreas).length) {
            alert("올바른 형식의 데이터를 찾지 못했습니다.\n예: 생명과학관 주차장: 37.54127, 127.07441");
            return;
        }
        $("upload-status").textContent = "Firebase에 저장하는 중입니다…";
        await database.ref(DATABASE_PATH).set(parsedAreas);
        $("upload-status").textContent = `${Object.keys(parsedAreas).length}개 흡연 구역을 저장했습니다. 접속 중인 기기에 자동 반영됩니다.`;
        alert("Firebase 저장이 완료되었습니다. 모든 기기에 목록이 동기화됩니다.");
    } catch (error) {
        console.error("TXT 업로드/저장 오류:", error);
        $("upload-status").textContent = "저장 실패: Database 보안 규칙, 관리자 UID, 네트워크를 확인해주세요.";
        alert("Firebase 저장에 실패했습니다. 관리자 UID와 Realtime Database 보안 규칙을 확인해주세요.");
    } finally {
        event.target.value = "";
    }
});

function renderSmokingAreas(areas) {
    markers.forEach(marker => marker.setMap(null));
    markers = [];
    smokingAreaMarkers = {};
    const list = $("smoking-area-list");
    list.innerHTML = "";

    Object.entries(areas).forEach(([name, coords]) => {
        if (!Array.isArray(coords) || coords.length < 2) return;
        const lat = Number(coords[0]);
        const lng = Number(coords[1]);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

        const marker = new naver.maps.Marker({
            position: new naver.maps.LatLng(lat, lng),
            map,
            title: name,
            icon: createSmokingAreaIcon(false)
        });
        smokingAreaMarkers[name] = marker;
        const infoWindow = new naver.maps.InfoWindow({
            content: `<div class="iw_inner shadow-md"><b>${escapeHtml(name)}</b><br>흡연 구역</div>`,
            borderWidth: 0,
            backgroundColor: "transparent",
            disableAnchor: true
        });
        naver.maps.Event.addListener(marker, "click", () => {
            if (infoWindow.getMap()) infoWindow.close();
            else infoWindow.open(map, marker);
        });
        markers.push(marker);

        const li = document.createElement("li");
        li.className = "flex items-center gap-2 py-1";
        const dot = document.createElement("span");
        dot.className = "w-2 h-2 bg-blue-500 rounded-full flex-shrink-0";
        const label = document.createElement("span");
        label.className = "truncate";
        label.textContent = name;
        li.append(dot, label);
        list.appendChild(li);
    });

    if (!list.children.length) {
        const li = document.createElement("li");
        li.className = "text-gray-400 text-center py-2";
        li.textContent = "등록된 흡연 구역이 없습니다.";
        list.appendChild(li);
    }
}

function createSmokingAreaIcon(isClosest) {
    if (!isClosest) {
        return {
            content: '<div style="width:10px;height:10px;background:#2563eb;border:2px solid #fff;border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.45);"></div>',
            size: new naver.maps.Size(10, 10),
            anchor: new naver.maps.Point(5, 5)
        };
    }
    return {
        content: '<svg width="38" height="48" viewBox="0 0 38 48" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;filter:drop-shadow(0 2px 3px rgba(0,0,0,.45))"><path d="M19 1C9.1 1 1 9.1 1 19c0 13 18 28 18 28s18-15 18-28C37 9.1 28.9 1 19 1Z" fill="#ef4444" stroke="#fff" stroke-width="2"/><circle cx="19" cy="19" r="7" fill="#fff"/><circle cx="19" cy="19" r="3" fill="#ef4444"/></svg>',
        size: new naver.maps.Size(38, 48),
        anchor: new naver.maps.Point(19, 48)
    };
}

function highlightClosestSmokingArea(name) {
    Object.entries(smokingAreaMarkers).forEach(([areaName, marker]) => {
        const selected = areaName === name;
        marker.setIcon(createSmokingAreaIcon(selected));
        marker.setZIndex(selected ? 1000 : 1);
    });
}

function getDistance(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) ** 2;
    return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a))) * 1000;
}

function fetchCurrentLocation() {
    const input = $("departure-input");
    if (!navigator.geolocation) {
        showResult("이 브라우저에서는 GPS를 지원하지 않습니다. 건물명이나 주소를 입력해주세요.", true);
        return;
    }
    input.value = "현재 위치 확인 중…";
    navigator.geolocation.getCurrentPosition(position => {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        currentUserLatLng = new naver.maps.LatLng(lat, lng);
        updateUserMarker(currentUserLatLng);
        map.setCenter(currentUserLatLng);
        input.value = "내 현재 위치 (GPS)";
        showResult("현재 위치를 확인했습니다. 찾기를 눌러 가까운 흡연 구역을 검색하세요.");
    }, error => {
        console.warn("GPS 오류:", error);
        input.value = "";
        showResult("현재 위치를 가져오지 못했습니다. 위치 권한과 HTTPS 연결을 확인하거나 출발지를 직접 입력해주세요.", true);
    }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
}
$("btn-gps").addEventListener("click", fetchCurrentLocation);

function updateUserMarker(latLng) {
    if (userMarker) userMarker.setMap(null);
    userMarker = new naver.maps.Marker({
        position: latLng,
        map,
        icon: {
            content: '<div style="background-color:#ef4444;width:16px;height:16px;border-radius:50%;border:2px solid white;box-shadow:0 0 5px rgba(0,0,0,.5);"></div>',
            anchor: new naver.maps.Point(8, 8)
        }
    });
}

// Naver Maps JS Geocoder는 주소 지오코딩 기능입니다.
// 건물명은 주소 검색 결과가 없을 수 있어 캠퍼스명을 붙인 검색도 순차 시도합니다.
function geocodeDeparture(query) {
    return new Promise((resolve, reject) => {
        if (!naver.maps.Service || !naver.maps.Service.geocode) {
            reject(new Error("Geocoding 서비스가 활성화되지 않았습니다."));
            return;
        }
        const queries = [query];
        if (!query.includes("건국대학교")) {
            queries.push("건국대학교 서울캠퍼스 " + query);
            queries.push("서울특별시 광진구 능동로 120 " + query);
        }
        const tryNext = index => {
            if (index >= queries.length) {
                reject(new Error("검색 결과가 없습니다."));
                return;
            }
            naver.maps.Service.geocode({ query: queries[index] }, (status, response) => {
                const addresses = response && response.v2 && response.v2.addresses;
                if (status === naver.maps.Service.Status.OK && addresses && addresses.length) {
                    const item = addresses[0];
                    resolve({ lat: Number(item.y), lng: Number(item.x), matchedQuery: queries[index] });
                } else {
                    tryNext(index + 1);
                }
            });
        };
        tryNext(0);
    });
}

$("btn-search").addEventListener("click", async () => {
    const inputVal = $("departure-input").value.trim();
    if (!Object.keys(smokingAreas).length) {
        showResult("등록된 흡연 구역이 없습니다. 관리자에게 데이터 등록을 요청해주세요.", true);
        return;
    }
    if (!inputVal) {
        showResult("출발지 건물명 또는 주소를 입력해주세요.", true);
        return;
    }
    if ((inputVal.includes("내 현재 위치") || inputVal.includes("GPS")) && currentUserLatLng) {
        findNearest(currentUserLatLng.lat(), currentUserLatLng.lng());
        return;
    }

    showResult("출발지 주소를 검색 중입니다…");
    try {
        const result = await geocodeDeparture(inputVal);
        currentUserLatLng = new naver.maps.LatLng(result.lat, result.lng);
        updateUserMarker(currentUserLatLng);
        findNearest(result.lat, result.lng);
    } catch (error) {
        console.warn("출발지 지오코딩 실패:", error);
        const link = document.createElement("a");
        link.href = "https://map.naver.com/p/search/" + encodeURIComponent(inputVal);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "네이버 지도에서 장소 확인하기";
        link.className = "underline text-blue-700 font-bold";
        const panel = $("result-panel");
        panel.classList.remove("hidden");
        panel.innerHTML = "";
        const message = document.createElement("p");
        message.className = "text-red-600 font-bold";
        message.textContent = "건물명/주소의 좌표를 자동으로 찾지 못했습니다.";
        const note = document.createElement("p");
        note.className = "text-xs mt-1 text-gray-600";
        note.textContent = "네이버 지도 장소 검색으로 정확한 주소를 확인한 뒤 도로명 주소를 입력해주세요. 현재 연동된 Geocoding은 주소 검색이며, 별도의 장소 검색 API는 제공하지 않습니다.";
        panel.append(message, note, link);
    }
});

function findNearest(lat, lng) {
    let minDistance = Infinity;
    let closestName = "";
    let closestCoords = null;

    Object.entries(smokingAreas).forEach(([name, coords]) => {
        const distance = getDistance(lat, lng, coords[0], coords[1]);
        if (distance < minDistance) {
            minDistance = distance;
            closestName = name;
            closestCoords = coords;
        }
    });

    if (!closestName || !closestCoords) {
        showResult("거리 계산에 사용할 수 있는 흡연 구역 데이터가 없습니다.", true);
        return;
    }
    highlightClosestSmokingArea(closestName);
    const panel = $("result-panel");
    panel.classList.remove("hidden");
    panel.innerHTML = `
        <div class="flex items-center justify-between gap-3">
            <div><span class="text-gray-500 text-xs">가장 가까운 곳</span><br>
            <span class="text-lg text-blue-700 font-bold">${escapeHtml(closestName)}</span></div>
            <div class="text-right"><span class="text-gray-500 text-xs">직선 거리</span><br>
            <span class="font-bold text-gray-800">약 ${Math.round(minDistance)}m</span></div>
        </div>`;
    const target = new naver.maps.LatLng(closestCoords[0], closestCoords[1]);
    const bounds = new naver.maps.LatLngBounds(currentUserLatLng, currentUserLatLng);
    bounds.extend(target);
    map.fitBounds(bounds, { margin: 50 });
}

function showMapError(message) {
    const mapEl = $("map");
    mapEl.innerHTML = "";
    const box = document.createElement("div");
    box.className = "flex items-center justify-center h-full bg-gray-100 text-gray-700 text-center p-6";
    box.style.minHeight = "50vh";
    const content = document.createElement("div");
    const title = document.createElement("div");
    title.className = "font-bold mb-2";
    title.textContent = "지도를 불러오지 못했습니다.";
    const detail = document.createElement("p");
    detail.className = "text-sm";
    detail.textContent = message;
    const hint = document.createElement("p");
    hint.className = "text-xs mt-3 text-gray-500";
    hint.textContent = "네이버 클라우드 플랫폼의 Maps API 웹 서비스 URL에 GitHub Pages 주소가 등록되어 있는지 확인해주세요.";
    content.append(title, detail, hint);
    box.appendChild(content);
    mapEl.appendChild(box);
}

function initMap() {
    if (!window.naver || !naver.maps || !naver.maps.Map) {
        showMapError("네이버 지도 API 객체를 사용할 수 없습니다. Maps API 설정을 확인해주세요.");
        return;
    }
    try {
        const initialCenter = new naver.maps.LatLng(37.5408, 127.0793);
        map = new naver.maps.Map("map", { center: initialCenter, zoom: 16 });
        if (!firebaseReady) {
            smokingAreas = { ...DEFAULT_SMOKING_AREAS };
            renderSmokingAreas(smokingAreas);
        } else {
            renderSmokingAreas(smokingAreas);
        }
        // 페이지 로드 시 GPS를 자동 실행하지 않습니다.
        initializeFirebase();
    } catch (error) {
        console.error("지도 초기화 오류:", error);
        showMapError("지도를 초기화하지 못했습니다. 네이버 지도 API 키와 웹 서비스 URL 등록 상태를 확인해주세요.");
    }
}

window.addEventListener("load", () => {
    const mapEl = $("map");
    mapEl.textContent = "네이버 지도를 불러오는 중입니다…";
    mapEl.classList.add("flex", "items-center", "justify-center", "bg-gray-100", "text-gray-500");
    const script = document.createElement("script");
    script.src = "https://openapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=f5jf48j4dj&submodules=geocoder";
    script.async = true;
    script.onload = () => {
        mapEl.textContent = "";
        mapEl.classList.remove("flex", "items-center", "justify-center", "bg-gray-100", "text-gray-500");
        initMap();
    };
    script.onerror = () => showMapError("네이버 지도 API 스크립트를 불러오지 못했습니다. 인터넷 연결, API 키, Maps 서비스 설정을 확인해주세요.");
    document.head.appendChild(script);
});
</script>
